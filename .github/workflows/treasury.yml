name: Nexus Treasury Autonomous Governance Cycle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'  # Chạy điều tiết 4 lần mỗi ngày

permissions:
  contents: write

jobs:
  run-treasury-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Nexus Treasury
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git .

      - name: Thiết lập Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Vận hành Vi Nhân Quản Trị Topo
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: python engine.py

      - name: Lưu vết tích Sổ Cái Bện Topo vào Git
        run: |
          git config --global user.name "Nexus-Treasury-Custodian-Bot"
          git config --global user.email "bot@nexus.treasury"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          [ "$TARGET_BRANCH" = "HEAD" ] || [ -z "$TARGET_BRANCH" ] && TARGET_BRANCH="main"

          git fetch origin "$TARGET_BRANCH"
          git reset origin/"$TARGET_BRANCH"
          
          for d in core synapses; do
            [ -d "$d" ] && git add -A "$d"
          done
          
          if ! git diff --staged --quiet; then
            git commit -m "🏛️ [Nexus-Treasury] Cân bằng Tensegrity & Khóa sổ bện Topo mới [skip ci]"
            git push origin "$TARGET_BRANCH"
          else
            echo "Kho quỹ tĩnh lặng, trạng thái cân bằng Topo được bảo tồn."
          fi
